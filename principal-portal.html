<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Principal Portal</title>
  <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 4px;
      color: white;
      font-weight: 500;
      z-index: 1000;
      transform: translateX(150%);
      transition: transform 0.3s ease;
    }
    .toast.show {
      transform: translateX(0);
    }
    .toast.success {
      background-color: #10B981;
    }
    .toast.error {
      background-color: #EF4444;
    }
    .toast.info {
      background-color: #3B82F6;
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .status-pending {
      background-color: #FEF3C7;
      color: #92400E;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status-approved {
      background-color: #D1FAE5;
      color: #065F46;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status-rejected {
      background-color: #FEE2E2;
      color: #991B1B;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .tab-button {
      padding: 10px 20px;
      border: none;
      background-color: #f3f4f6;
      cursor: pointer;
      border-radius: 4px;
      margin-right: 5px;
    }
    .tab-button.active {
      background-color: #4f46e5;
      color: white;
    }
  </style>
</head>
<body class="bg-gray-100">

  <!-- LOGIN SECTION -->
  <div id="login-section" class="flex justify-center items-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md fade-in">
      <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">Principal Login</h2>

      <form id="loginForm">
        <div class="mb-6">
          <label for="login-password" class="block text-gray-700 font-medium mb-2">Password</label>
          <input type="password" id="login-password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Enter password" required>
          <p class="text-xs text-gray-500 mt-1">Default password: YCIP@123</p>
        </div>
        
        <button type="submit" class="w-full bg-indigo-500 text-white py-2 rounded hover:bg-indigo-600 transition duration-200">Login</button>
      </form>
    </div>
  </div>

  <!-- APPLICATIONS SECTION -->
  <div id="applications-section" class="hidden">
    <div class="container mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-600">Principal Portal</h1>
        <div class="flex items-center space-x-4">
          <span class="text-lg font-medium text-gray-700">Principal Dashboard</span>
          <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">
            Logout
          </button>
        </div>
      </div>
      
      <!-- Tabs for Pending Applications and History -->
      <div class="mb-6">
        <button id="pending-tab" class="tab-button active">Pending Applications</button>
        <button id="history-tab" class="tab-button">Application History</button>
        <button id="stats-tab" class="tab-button">Statistics</button>
      </div>
      
      <!-- Pending Applications Section -->
      <div id="pending-section" class="bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Pending Applications</h2>
        
        <!-- Department Filter -->
        <div class="mb-6">
          <label for="department-filter" class="block text-gray-700 font-medium mb-2">Filter by Department</label>
          <select id="department-filter" class="px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="all">All Departments</option>
            <option value="CM">Computer Engineering</option>
            <option value="CE">Civil Engineering</option>
            <option value="AI">Automobile Engineering</option>
            <option value="ME">Mechanical Engineering</option>
            <option value="EE">Electrical Engineering</option>
            <option value="EJ">Electronics Engineering</option>
          </select>
        </div>
        
        <div id="applicationsList" class="space-y-4">
          <!-- Applications will be loaded here -->
        </div>
      </div>
      
      <!-- Application History Section -->
      <div id="history-section" class="bg-white rounded-lg shadow-lg p-6 hidden">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Application History</h2>
        
        <!-- Filters -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div>
            <label for="history-department" class="block text-gray-700 font-medium mb-2">Department</label>
            <select id="history-department" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <option value="all">All Departments</option>
              <option value="CM">Computer Engineering</option>
              <option value="CE">Civil Engineering</option>
              <option value="AI">Automobile Engineering</option>
              <option value="ME">Mechanical Engineering</option>
              <option value="EE">Electrical Engineering</option>
              <option value="EJ">Electronics Engineering</option>
            </select>
          </div>
          <div>
            <label for="history-date" class="block text-gray-700 font-medium mb-2">Date</label>
            <input type="date" id="history-date" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div>
            <label for="history-status" class="block text-gray-700 font-medium mb-2">Status</label>
            <select id="history-status" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <option value="all">All Status</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="pending">Pending</option>
            </select>
          </div>
        </div>
        
        <div class="flex space-x-2 mb-6">
          <button id="apply-history-filter" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 transition">
            Apply Filters
          </button>
          <button id="clear-history-filter" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition">
            Clear Filters
          </button>
          <button id="export-history" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition">
            Export to CSV
          </button>
        </div>
        
        <div id="historyList" class="space-y-4">
          <!-- History will be loaded here -->
        </div>
      </div>
      
      <!-- Statistics Section -->
      <div id="stats-section" class="bg-white rounded-lg shadow-lg p-6 hidden">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Application Statistics</h2>
        
        <!-- Date Range Filter -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div>
            <label for="stats-start-date" class="block text-gray-700 font-medium mb-2">Start Date</label>
            <input type="date" id="stats-start-date" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div>
            <label for="stats-end-date" class="block text-gray-700 font-medium mb-2">End Date</label>
            <input type="date" id="stats-end-date" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div class="flex items-end">
            <button id="apply-stats-filter" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 transition w-full">
              Generate Report
            </button>
          </div>
        </div>
        
        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6" id="stats-cards">
          <!-- Stats cards will be loaded here -->
        </div>
        
        <!-- Department-wise Statistics -->
        <div class="mb-6">
          <h3 class="text-xl font-semibold text-gray-800 mb-4">Department-wise Applications</h3>
          <div id="department-stats" class="space-y-4">
            <!-- Department stats will be loaded here -->
          </div>
        </div>
        
        <!-- Application Type Statistics -->
        <div>
          <h3 class="text-xl font-semibold text-gray-800 mb-4">Application Type Statistics</h3>
          <div id="type-stats" class="space-y-4">
            <!-- Type stats will be loaded here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Toast notification function
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Check if principal is already logged in
    function checkPrincipalStatus() {
      const currentPrincipal = localStorage.getItem('currentPrincipal');
      if (currentPrincipal) {
        showApplicationsSection();
      }
    }

    // Show specific section and hide others
    function showSection(sectionId) {
      const sections = ['login-section', 'applications-section'];
      sections.forEach(id => {
        const element = document.getElementById(id);
        if (id === sectionId) {
          element.classList.remove('hidden');
          if (id === 'login-section') {
            element.classList.add('flex');
          }
        } else {
          element.classList.add('hidden');
          if (id === 'login-section') {
            element.classList.remove('flex');
          }
        }
      });
    }

    // Show applications section
    function showApplicationsSection() {
      showSection('applications-section');
      loadApplications();
    }

    // Get department full name
    function getDepartmentFullName(deptCode) {
      const departments = {
        'CM': 'Computer Engineering',
        'CE': 'Civil Engineering',
        'AI': 'Automobile Engineering',
        'ME': 'Mechanical Engineering',
        'EE': 'Electrical Engineering',
        'EJ': 'Electronics Engineering'
      };
      return departments[deptCode] || deptCode;
    }

    // Verify principal login
    function verifyLogin(password) {
      const correctPassword = "YCIP@123";
      
      if (password === correctPassword) {
        const principal = {
          loginTime: new Date().toISOString()
        };
        localStorage.setItem('currentPrincipal', JSON.stringify(principal));
        return principal;
      }
      
      return null;
    }

    // Load applications for principal approval
    function loadApplications() {
      const applications = JSON.parse(localStorage.getItem('applications') || '[]');
      const departmentFilter = document.getElementById('department-filter').value;
      
      // Filter applications for principal approval
      let pendingApplications = applications.filter(app => 
        app.currentApprover === 'principal' && 
        app.status === 'pending'
      );
      
      // Apply department filter
      if (departmentFilter !== 'all') {
        pendingApplications = pendingApplications.filter(app => 
          app.class.startsWith(departmentFilter)
        );
      }
      
      const applicationsList = document.getElementById('applicationsList');
      
      if (pendingApplications.length === 0) {
        applicationsList.innerHTML = '<p class="text-gray-500 text-center py-8">No pending applications for approval.</p>';
        return;
      }
      
      applicationsList.innerHTML = pendingApplications.map(application => `
        <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-semibold text-lg">${application.fullName}</h3>
              <p class="text-sm text-gray-500">${application.class} | Roll No: ${application.studentRollNo || 'N/A'}</p>
            </div>
            <div class="flex flex-col items-end">
              <span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-0.5 rounded mb-1">${application.type}</span>
              <span class="text-xs text-gray-500">${getDepartmentFullName(application.class.substring(0, 2))}</span>
            </div>
          </div>
          <p class="text-gray-600 mb-2"><strong>Reason:</strong> ${application.reason}</p>
          <p class="text-gray-600 mb-2"><strong>Date:</strong> ${application.date}</p>
          ${application.outDate ? `<p class="text-gray-600 mb-2"><strong>Out Date:</strong> ${application.outDate}</p>` : ''}
          ${application.inDate ? `<p class="text-gray-600 mb-2"><strong>In Date:</strong> ${application.inDate}</p>` : ''}
          ${application.outTime ? `<p class="text-gray-600 mb-2"><strong>Out Time:</strong> ${application.outTime}</p>` : ''}
          ${application.birthDate ? `<p class="text-gray-600 mb-2"><strong>Birth Date:</strong> ${application.birthDate}</p>` : ''}
          ${application.feesEnrollmentNo ? `<p class="text-gray-600 mb-2"><strong>Enrollment No:</strong> ${application.feesEnrollmentNo}</p>` : ''}
          <p class="text-gray-600 mb-4"><strong>Approved by:</strong> ${application.approvedBy.join(', ')}</p>
          <div class="flex space-x-2 mt-4">
            <button onclick="approveApplication(${application.id})" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition">
              Approve
            </button>
            <button onclick="rejectApplication(${application.id})" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">
              Reject
            </button>
          </div>
        </div>
      `).join('');
    }

    // Load application history
    function loadApplicationHistory(filters = {}) {
      const applications = JSON.parse(localStorage.getItem('applications') || '[]');
      
      let filteredApplications = applications;
      
      // Apply department filter
      if (filters.department && filters.department !== 'all') {
        filteredApplications = filteredApplications.filter(app => 
          app.class.startsWith(filters.department)
        );
      }
      
      // Apply date filter
      if (filters.date) {
        filteredApplications = filteredApplications.filter(app => app.date === filters.date);
      }
      
      // Apply status filter
      if (filters.status && filters.status !== 'all') {
        filteredApplications = filteredApplications.filter(app => app.status === filters.status);
      }
      
      const historyList = document.getElementById('historyList');
      
      if (filteredApplications.length === 0) {
        historyList.innerHTML = '<p class="text-gray-500 text-center py-8">No applications found with the selected filters.</p>';
        return;
      }
      
      // Sort applications by submission date (newest first)
      filteredApplications.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
      
      historyList.innerHTML = filteredApplications.map(application => `
        <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-semibold text-lg">${application.fullName}</h3>
              <p class="text-sm text-gray-500">${application.class} | Roll No: ${application.studentRollNo || 'N/A'}</p>
            </div>
            <div class="flex flex-col items-end">
              <span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-0.5 rounded mb-1">${application.type}</span>
              <span class="status-${application.status}">${application.status.charAt(0).toUpperCase() + application.status.slice(1)}</span>
            </div>
          </div>
          <p class="text-gray-600 mb-2"><strong>Reason:</strong> ${application.reason}</p>
          <p class="text-gray-600 mb-2"><strong>Date:</strong> ${application.date}</p>
          <p class="text-gray-600 mb-2"><strong>Department:</strong> ${getDepartmentFullName(application.class.substring(0, 2))}</p>
          ${application.outDate ? `<p class="text-gray-600 mb-2"><strong>Out Date:</strong> ${application.outDate}</p>` : ''}
          ${application.inDate ? `<p class="text-gray-600 mb-2"><strong>In Date:</strong> ${application.inDate}</p>` : ''}
          ${application.outTime ? `<p class="text-gray-600 mb-2"><strong>Out Time:</strong> ${application.outTime}</p>` : ''}
          <p class="text-gray-600 mb-2"><strong>Submitted:</strong> ${new Date(application.submittedAt).toLocaleString()}</p>
          ${application.approvedBy.length > 0 ? `<p class="text-gray-600 mb-2"><strong>Approved by:</strong> ${application.approvedBy.join(', ')}</p>` : ''}
          ${application.rejectedBy ? `<p class="text-gray-600 mb-2"><strong>Rejected by:</strong> ${application.rejectedBy}</p>` : ''}
        </div>
      `).join('');
    }

    // Load statistics
    function loadStatistics(dateRange = {}) {
      const applications = JSON.parse(localStorage.getItem('applications') || '[]');
      
      let filteredApplications = applications;
      
      // Apply date range filter
      if (dateRange.startDate && dateRange.endDate) {
        filteredApplications = filteredApplications.filter(app => {
          const appDate = new Date(app.submittedAt);
          return appDate >= new Date(dateRange.startDate) && appDate <= new Date(dateRange.endDate);
        });
      }
      
      // Calculate statistics
      const totalApplications = filteredApplications.length;
      const approvedApplications = filteredApplications.filter(app => app.status === 'approved').length;
      const rejectedApplications = filteredApplications.filter(app => app.status === 'rejected').length;
      const pendingApplications = filteredApplications.filter(app => app.status === 'pending').length;
      
      // Department-wise statistics
      const departmentStats = {};
      filteredApplications.forEach(app => {
        const dept = app.class.substring(0, 2);
        if (!departmentStats[dept]) {
          departmentStats[dept] = { total: 0, approved: 0, rejected: 0, pending: 0 };
        }
        departmentStats[dept].total++;
        departmentStats[dept][app.status]++;
      });
      
      // Type-wise statistics
      const typeStats = {};
      filteredApplications.forEach(app => {
        if (!typeStats[app.type]) {
          typeStats[app.type] = { total: 0, approved: 0, rejected: 0, pending: 0 };
        }
        typeStats[app.type].total++;
        typeStats[app.type][app.status]++;
      });
      
      // Update stats cards
      document.getElementById('stats-cards').innerHTML = `
        <div class="bg-indigo-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-indigo-800">Total Applications</h3>
          <p class="text-3xl font-bold text-indigo-600">${totalApplications}</p>
        </div>
        <div class="bg-green-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-green-800">Approved</h3>
          <p class="text-3xl font-bold text-green-600">${approvedApplications}</p>
        </div>
        <div class="bg-red-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-red-800">Rejected</h3>
          <p class="text-3xl font-bold text-red-600">${rejectedApplications}</p>
        </div>
        <div class="bg-yellow-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-yellow-800">Pending</h3>
          <p class="text-3xl font-bold text-yellow-600">${pendingApplications}</p>
        </div>
      `;
      
      // Update department stats
      document.getElementById('department-stats').innerHTML = Object.keys(departmentStats).map(dept => `
        <div class="border border-gray-200 rounded-lg p-4">
          <h4 class="font-semibold text-lg mb-2">${getDepartmentFullName(dept)}</h4>
          <div class="grid grid-cols-4 gap-2 text-sm">
            <div class="text-center">
              <p class="font-medium">Total</p>
              <p class="text-xl">${departmentStats[dept].total}</p>
            </div>
            <div class="text-center">
              <p class="font-medium text-green-600">Approved</p>
              <p class="text-xl">${departmentStats[dept].approved}</p>
            </div>
            <div class="text-center">
              <p class="font-medium text-red-600">Rejected</p>
              <p class="text-xl">${departmentStats[dept].rejected}</p>
            </div>
            <div class="text-center">
              <p class="font-medium text-yellow-600">Pending</p>
              <p class="text-xl">${departmentStats[dept].pending}</p>
            </div>
          </div>
        </div>
      `).join('');
      
      // Update type stats
      document.getElementById('type-stats').innerHTML = Object.keys(typeStats).map(type => `
        <div class="border border-gray-200 rounded-lg p-4">
          <h4 class="font-semibold text-lg mb-2">${type} Applications</h4>
          <div class="grid grid-cols-4 gap-2 text-sm">
            <div class="text-center">
              <p class="font-medium">Total</p>
              <p class="text-xl">${typeStats[type].total}</p>
            </div>
            <div class="text-center">
              <p class="font-medium text-green-600">Approved</p>
              <p class="text-xl">${typeStats[type].approved}</p>
            </div>
            <div class="text-center">
              <p class="font-medium text-red-600">Rejected</p>
              <p class="text-xl">${typeStats[type].rejected}</p>
            </div>
            <div class="text-center">
              <p class="font-medium text-yellow-600">Pending</p>
              <p class="text-xl">${typeStats[type].pending}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Approve application
    function approveApplication(applicationId) {
      const applications = JSON.parse(localStorage.getItem('applications') || '[]');
      const application = applications.find(app => app.id === applicationId);
      
      if (application) {
        application.approvedBy.push('Principal');
        application.currentApprover = 'completed';
        application.status = 'approved';
        
        localStorage.setItem('applications', JSON.stringify(applications));
        showToast('Application approved successfully');
        
        // Reload applications
        loadApplications();
      }
    }

    // Reject application
    function rejectApplication(applicationId) {
      const applications = JSON.parse(localStorage.getItem('applications') || '[]');
      const application = applications.find(app => app.id === applicationId);
      
      if (application) {
        application.status = 'rejected';
        application.currentApprover = 'student';
        application.rejectedBy = 'Principal';
        
        localStorage.setItem('applications', JSON.stringify(applications));
        showToast('Application rejected');
        
        // Reload applications
        loadApplications();
      }
    }

    // Export to CSV
    function exportToCSV() {
      const applications = JSON.parse(localStorage.getItem('applications') || '[]');
      
      if (applications.length === 0) {
        showToast('No data to export', 'error');
        return;
      }
      
      // Create CSV header
      let csv = 'Application ID,Type,Student Name,Roll No,Class,Reason,Date,Status,Submitted Date,Approved By\n';
      
      // Add data rows
      applications.forEach(app => {
        csv += `"${app.id}","${app.type}","${app.fullName}","${app.studentRollNo || ''}","${app.class}","${app.reason}","${app.date}","${app.status}","${new Date(app.submittedAt).toLocaleDateString()}","${app.approvedBy.join(', ')}"\n`;
      });
      
      // Create download link
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('hidden', '');
      a.setAttribute('href', url);
      a.setAttribute('download', `applications_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      showToast('Data exported successfully');
    }

    // Handle login form submission
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const password = document.getElementById("login-password").value;
      
      if (password) {
        // Verify login
        const principal = verifyLogin(password);
        
        if (principal) {
          showApplicationsSection();
          showToast('Login successful!', 'success');
        } else {
          showToast('Invalid password!', 'error');
        }
      } else {
        showToast('Please enter password!', 'error');
      }
    });

    // Handle logout
    document.getElementById('logout-btn').addEventListener('click', function() {
      localStorage.removeItem('currentPrincipal');
      showSection('login-section');
      document.getElementById("loginForm").reset();
      showToast('Logged out successfully!', 'success');
    });

    // Tab switching
    document.getElementById('pending-tab').addEventListener('click', function() {
      document.getElementById('pending-section').classList.remove('hidden');
      document.getElementById('history-section').classList.add('hidden');
      document.getElementById('stats-section').classList.add('hidden');
      document.getElementById('pending-tab').classList.add('active');
      document.getElementById('history-tab').classList.remove('active');
      document.getElementById('stats-tab').classList.remove('active');
      loadApplications();
    });

    document.getElementById('history-tab').addEventListener('click', function() {
      document.getElementById('pending-section').classList.add('hidden');
      document.getElementById('history-section').classList.remove('hidden');
      document.getElementById('stats-section').classList.add('hidden');
      document.getElementById('pending-tab').classList.remove('active');
      document.getElementById('history-tab').classList.add('active');
      document.getElementById('stats-tab').classList.remove('active');
      loadApplicationHistory();
    });

    document.getElementById('stats-tab').addEventListener('click', function() {
      document.getElementById('pending-section').classList.add('hidden');
      document.getElementById('history-section').classList.add('hidden');
      document.getElementById('stats-section').classList.remove('hidden');
      document.getElementById('pending-tab').classList.remove('active');
      document.getElementById('history-tab').classList.remove('active');
      document.getElementById('stats-tab').classList.add('active');
      loadStatistics();
    });

    // Handle department filter change
    document.getElementById('department-filter').addEventListener('change', function() {
      loadApplications();
    });

    // Handle history filters
    document.getElementById('apply-history-filter').addEventListener('click', function() {
      const filters = {
        department: document.getElementById('history-department').value,
        date: document.getElementById('history-date').value,
        status: document.getElementById('history-status').value
      };
      loadApplicationHistory(filters);
    });

    // Handle clear history filter
    document.getElementById('clear-history-filter').addEventListener('click', function() {
      document.getElementById('history-department').value = 'all';
      document.getElementById('history-date').value = '';
      document.getElementById('history-status').value = 'all';
      loadApplicationHistory();
    });

    // Handle export history
    document.getElementById('export-history').addEventListener('click', exportToCSV);

    // Handle stats filters
    document.getElementById('apply-stats-filter').addEventListener('click', function() {
      const dateRange = {
        startDate: document.getElementById('stats-start-date').value,
        endDate: document.getElementById('stats-end-date').value
      };
      loadStatistics(dateRange);
    });

    // Check principal status on page load
    document.addEventListener('DOMContentLoaded', checkPrincipalStatus);
  </script>

</body>
</html>
